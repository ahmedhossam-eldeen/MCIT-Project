<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="signup.css">
    <title>MCIT Signup</title>
</head>
<body>

<header>
    <a href="index.html"><img src="logo.svg" alt="MCIT logo" class="logo"></a>
    <nav class="nav_main">
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="Events.html">Events</a></li>
            <li><a href="upcoming_events.html">Upcoming Events</a></li>
            <li><a href="administration_login.html">Administration</a></li>
            <li><a href="login.html">Login</a></li>
            <li><a href="signup.html" aria-current="page">Sign Up</a></li>
        </ul>
    </nav>
</header>

<main>
    <div class="page-title">
        <h1>Sign Up</h1>
        <p>Create an account to join the events.</p>
    </div>

    <form class="login-form" method="post" action="#">
        <div class="field">
            <label for="username">Username</label>
            <input type="text" id="username" name="name" placeholder="Enter your username" autocomplete="username" required>
        </div>

        <div class="field">
            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" name="Phone_Number" placeholder="Enter your phone number" autocomplete="tel" required>
        </div>

        <div class="field">
            <label for="email">Gmail</label>
            <input type="email" id="email" name="Gmail" placeholder="Enter your Gmail" autocomplete="email" required>
        </div>

        <div class="field">
            <label for="password">Password</label>
            <div class="password-wrap">
                <input type="password" id="password" name="password" placeholder="Create a password" autocomplete="new-password" required>
                <button type="button" class="toggle-pass" id="togglePass" aria-label="Show password">Show</button>
            </div>
        </div>

        <input type="submit" value="Sign Up">

        <p class="form-note">Have an account? <a href="login.html">Login</a></p>
    </form>
</main>

<footer>
    <h2>All Rights Reserved, MCIT 2026</h2>
</footer>

<script src="signup.js"></script>

</body>
</html>
