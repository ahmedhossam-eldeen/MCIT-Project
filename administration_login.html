<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="administration_login.css">
    <title>MCIT Administration Login</title>
</head>
<body>

<header>
    <a href="index.html"><img src="logo.svg" alt="MCIT logo" class="logo"></a>
    <nav class="nav_main">
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="Events.html">Events</a></li>
            <li><a href="upcoming_events.html">Upcoming Events</a></li>
            <li><a href="login.html">Login</a></li>
            <li><a href="signup.html">Sign Up</a></li>
            <li><a href="administration_login.html" aria-current="page">Administration</a></li>
        </ul>
    </nav>
</header>

<main>
    <div class="page-title">
        <h1>Administration</h1>
        <p>Sign in with your administrator account.</p>
    </div>

    <form class="login-form" method="post" action="#">
        <div class="field">
            <label for="username">Username</label>
            <input type="text" id="username" name="name" placeholder="Enter your username" autocomplete="username" required>
        </div>

        <div class="field">
            <label for="password">Password</label>
            <div class="password-wrap">
                <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" required>
                <button type="button" class="toggle-pass" id="togglePass" aria-label="Show password">Show</button>
            </div>
        </div>

        <input type="submit" value="Login">

        <p class="form-note">Not an administrator? <a href="login.html">Go to user login</a></p>
    </form>
</main>

<footer>
    <h2>All Rights Reserved, MCIT 2026</h2>
</footer>

<script src="administration_login.js"></script>

</body>
</html>
